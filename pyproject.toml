[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mida-python"
version = "0.1.0"
description = "Mida.so server-side A/B testing and feature flags client for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = ["requests"]
keywords = ["mida", "experiment", "split testing", "ab testing", "feature flags"]
authors = [{ name = "Mida.so", email = "hello@mida.so" }]

[project.urls]
Homepage = "https://www.mida.so"
Repository = "https://github.com/mida-so/mida-python"

[tool.setuptools]
py-modules = ["mida"]
